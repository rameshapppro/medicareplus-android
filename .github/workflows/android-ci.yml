name: Android CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ==========================================================
  # BUILD & QUALITY
  # ==========================================================

  build:
    name: Android Build & Quality Checks
    runs-on: ubuntu-latest

    steps:

      # -------------------------------------------------------
      # Checkout source code
      # -------------------------------------------------------

      - name: Checkout code
        uses: actions/checkout@v6

      # -------------------------------------------------------
      # Setup JDK 17
      # -------------------------------------------------------

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # -------------------------------------------------------
      # Setup Gradle
      # -------------------------------------------------------

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # -------------------------------------------------------
      # Make Gradle Wrapper executable
      # -------------------------------------------------------

      - name: Grant execute permission for Gradle Wrapper
        run: chmod +x ./gradlew

      # -------------------------------------------------------
      # Unit Tests
      # -------------------------------------------------------

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      # -------------------------------------------------------
      # Android Lint
      # -------------------------------------------------------

      - name: Run Android Lint
        run: ./gradlew lintDebug

      # -------------------------------------------------------
      # Build Debug APK
      # -------------------------------------------------------

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # -------------------------------------------------------
      # Upload Debug APK
      # -------------------------------------------------------

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: medicareplus-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # -------------------------------------------------------
      # Upload Lint Report
      # -------------------------------------------------------

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore


  # ==========================================================
  # EMAIL NOTIFICATION
  # ==========================================================

  notification:
    name: Send CI Email Notification
    runs-on: ubuntu-latest

    needs:
      - build

    if: always()

    steps:

      - name: Send CI notification email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CI_NOTIFICATION_EMAIL: ${{ secrets.CI_NOTIFICATION_EMAIL }}
        run: |

          if [ "${{ needs.build.result }}" = "success" ]; then
            STATUS="SUCCESS"
            STATUS_ICON="✅"
            MESSAGE="MediCarePlus Android CI completed successfully."
          else
            STATUS="FAILED"
            STATUS_ICON="❌"
            MESSAGE="MediCarePlus Android CI failed. Please check the GitHub Actions logs."
          fi

          curl -X POST "https://api.resend.com/emails" \
            -H "Authorization: Bearer ${RESEND_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{
              \"from\": \"MediCarePlus CI <onboarding@resend.dev>\",
              \"to\": [\"${CI_NOTIFICATION_EMAIL}\"],
              \"subject\": \"${STATUS_ICON} MediCarePlus CI - ${STATUS}\",
              \"html\": \"<h2>${STATUS_ICON} MediCarePlus Android CI</h2><p>${MESSAGE}</p><p><strong>Branch:</strong> ${{ github.ref_name }}</p><p><strong>Commit:</strong> ${{ github.sha }}</p><p><strong>Author:</strong> ${{ github.actor }}</p><p><strong>Workflow:</strong> ${{ github.workflow }}</p><p><a href='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'>View GitHub Actions Run</a></p>\"
            }"
